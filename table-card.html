<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rainbrew Table Card</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=DM+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff8f4;--ink:#2b1b1f;--muted:#7b6469;--navy:#1d1c52;color-scheme:light}
@page{size:A6 portrait;margin:0}
*{box-sizing:border-box}
body{margin:0;background:#e9e2df;font-family:'DM Sans',system-ui,sans-serif;color:var(--ink)}
.tip{max-width:420px;margin:16px auto;padding:0 16px;font-size:14px;color:var(--muted);text-align:center}
.card{width:105mm;height:148mm;margin:0 auto 24px;background:var(--bg);position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12mm 8mm;text-align:center;box-shadow:0 4px 20px rgba(0,0,0,.12);overflow:hidden}
.card::before,.card::after{content:'';position:absolute;left:0;right:0;height:5mm;background:linear-gradient(90deg,#ff4d4d,#ff9a3d,#ffd23d,#5ccf6e,#3da9ff,#8a5cff,#ff5cc8)}
.card::before{top:0}.card::after{bottom:0}
.wm{font-family:'Fredoka',sans-serif;font-weight:700;font-size:15mm;line-height:1;letter-spacing:.3mm}
.wm span:nth-child(1){color:#ff4d4d}.wm span:nth-child(2){color:#ff8a2b}.wm span:nth-child(3){color:#b98a00}.wm span:nth-child(4){color:#3fb556}.wm span:nth-child(5){color:#2e93ee}.wm span:nth-child(6){color:#7a4df0}.wm span:nth-child(7){color:#e84db3}
h1{font-family:'Fredoka',sans-serif;font-weight:600;font-size:8mm;color:var(--navy);margin:5mm 0 1mm}
p{margin:0;font-size:3.6mm;color:var(--muted)}
img{width:58mm;height:58mm;margin:6mm 0 4mm;border-radius:3mm;background:#fff;padding:2mm}
.url{font-weight:700;font-size:3.3mm;color:var(--navy);word-break:break-all}
@media print{body{background:none}.tip{display:none}.card{margin:0;box-shadow:none}}
</style>
</head>
<body>
<p class="tip">Print this page (A6, or A4 and cut) for your tables. The QR code opens the online menu.</p>
<div class="card">
  <div class="wm" aria-label="Rainbrew"><span>R</span><span>a</span><span>i</span><span>n</span><span>b</span><span>r</span><span>e</span><span>w</span></div>
  <h1>Scan for our menu</h1>
  <p>Order ahead or send us a message</p>
  <img src="qr.svg" alt="QR code for the Rainbrew online menu">
  <div class="url">rainbrewhr.github.io/online-menu</div>
</div>
</body>
</html>
