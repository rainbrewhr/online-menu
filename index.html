<html lang="en">

<title>Rainbrew Online Menu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: sticky brand bar with search and category chips; one long scroll of dotted-leader price rows, two price columns where a size or serving applies. */
:root{
  --bg:#fff8f4;
  --surface:#ffffff;
  --ink:#2b1b1f;
  --muted:#7b6469;
  --accent:#e8381f;
  --accent-ink:#ffffff;
  --navy:#1d1c52;
  --line:#f0dcd6;
  --soft:#ffe9e1;
  --display:'Fredoka','Trebuchet MS',system-ui,sans-serif;
  --body:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1b1315;
    --surface:#261b1e;
    --ink:#fbeee9;
    --muted:#b89fa4;
    --accent:#ff6a4d;
    --accent-ink:#2b0f0a;
    --navy:#c9c8ff;
    --line:#3d2b2f;
    --soft:#3a2326;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1b1315;
  --surface:#261b1e;
  --ink:#fbeee9;
  --muted:#b89fa4;
  --accent:#ff6a4d;
  --accent-ink:#2b0f0a;
  --navy:#c9c8ff;
  --line:#3d2b2f;
  --soft:#3a2326;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
.stripe{height:6px;background:linear-gradient(90deg,#ff4d4d,#ff9a3d,#ffd23d,#5ccf6e,#3da9ff,#8a5cff,#ff5cc8)}
header.brand{padding:18px 16px 6px;max-width:760px;margin:0 auto}
.wordmark{font-family:var(--display);font-weight:700;font-size:44px;line-height:1;margin:0;letter-spacing:.5px;display:flex;flex-wrap:wrap}
.wordmark span:nth-child(1){color:#ff4d4d}.wordmark span:nth-child(2){color:#ff8a2b}.wordmark span:nth-child(3){color:#e8b400}.wordmark span:nth-child(4){color:#3fb556}.wordmark span:nth-child(5){color:#2e93ee}.wordmark span:nth-child(6){color:#7a4df0}.wordmark span:nth-child(7){color:#e84db3}
.sub{margin:6px 0 0;color:var(--muted);font-size:14px}
.sticky{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--line)}
.sticky-in{max-width:760px;margin:0 auto;padding:10px 16px 8px}
.search{position:relative}
.search input{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:11px 14px 11px 40px;outline:none}
.search input:focus-visible{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.tabs{display:flex;gap:8px;margin:10px 0 8px}
.tab{flex:1;font:inherit;font-weight:700;font-size:15px;padding:9px 10px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.tab[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--bg)}
.tab:focus-visible,.chip:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;font:inherit;font-size:14px;font-weight:500;padding:6px 13px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;white-space:nowrap}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
main{max-width:760px;margin:0 auto;padding:6px 16px 40px}
section{scroll-margin-top:calc(var(--stick,170px) + 12px);margin-top:26px}
section h2{font-family:var(--display);font-weight:600;font-size:28px;line-height:1.15;margin:0;color:var(--navy);text-wrap:balance}
section .note{margin:4px 0 0;color:var(--muted);font-size:14px}
.card{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:6px 16px}
.colhead{display:flex;justify-content:flex-end;gap:0;padding:10px 0 4px;border-bottom:1px solid var(--line);font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.colhead span,.row .p{min-width:64px;text-align:right}
.row{display:flex;align-items:baseline;gap:10px;padding:11px 0;border-bottom:1px dashed var(--line)}
.row:last-child{border-bottom:0}
.row .t{flex:1;min-width:0}
.row .n{font-weight:500;overflow-wrap:anywhere}
.row .d{display:block;font-size:13.5px;color:var(--muted);margin-top:1px}
.row .p{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.row .p.none{color:var(--muted);font-weight:400}
.sub-h{font-family:var(--display);font-weight:600;font-size:18px;margin:16px 0 0;color:var(--accent)}
.addons{margin-top:12px;background:var(--soft);border-radius:14px;padding:12px 16px}
.addons h3{margin:0 0 6px;font-family:var(--display);font-size:17px;font-weight:600}
.addons ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14.5px}
.addons li b{font-variant-numeric:tabular-nums}
.empty{display:none;text-align:center;color:var(--muted);padding:40px 0}
footer{max-width:760px;margin:0 auto;padding:0 16px 40px;color:var(--muted);font-size:13px}
footer p{margin:4px 0}
@media (min-width:640px){
  .wordmark{font-size:60px}
  .row .p,.colhead span{min-width:78px}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>

var menuEl=document.getElementById('menu'),chipsEl=document.getElementById('chips'),emptyEl=document.getElementById('empty'),qEl=document.getElementById('q');
var group='food';
function peso(v){return v===null||v===''?null:'₱'+v}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function rowHtml(it,cols,grp){
  var ps=it.p.map(function(v){var s=peso(v);return s?'<span class="p">'+s+'</span>':'<span class="p none">&ndash;</span>'}).join('');
  return '<div class="row" data-s="'+esc((it.n+' '+it.d+' '+(grp||'')).toLowerCase())+'"><div class="t"><span class="n">'+esc(it.n)+'</span>'+(it.d?'<span class="d">'+esc(it.d)+'</span>':'')+'</div>'+ps+'</div>';
}
function colHead(cols){return cols?'<div class="colhead">'+cols.map(function(c){return '<span>'+esc(c)+'</span>'}).join('')+'</div>':''}
function render(){
  var html='';
  MENU.forEach(function(s){
    html+='<section id="s-'+s.id+'" data-g="'+s.g+'"><h2>'+esc(s.t)+'</h2>'+(s.note?'<p class="note">'+esc(s.note)+'</p>':'');
    if(s.items&&s.items.length){html+='<div class="card">'+colHead(s.cols)+s.items.map(function(i){return rowHtml(i,s.cols)}).join('')+'</div>'}
    (s.sub||[]).forEach(function(b){
      html+='<h3 class="sub-h">'+esc(b.h)+'</h3><div class="card">'+colHead(s.cols)+b.items.map(function(i){return rowHtml(i,s.cols,b.h)}).join('')+'</div>';
    });
    if(s.add){html+='<div class="addons" data-s="'+esc((s.add.h+' '+s.add.l.map(function(x){return x[0]}).join(' ')).toLowerCase())+'"><h3>'+esc(s.add.h)+'</h3><ul>'+s.add.l.map(function(x){return '<li>'+esc(x[0])+(x[1]!==''?' <b>₱'+x[1]+'</b>':'')+'</li>'}).join('')+'</ul></div>'}
    html+='</section>';
  });
  menuEl.innerHTML=html;
}
function buildChips(){
  chipsEl.innerHTML=MENU.filter(function(s){return s.g===group}).map(function(s){return '<button type="button" class="chip" data-id="s-'+s.id+'">'+esc(s.t)+'</button>'}).join('');
}

    var any=false;
    sec.querySelectorAll('.row,.addons').forEach(function(r){
      var hit=!q||r.getAttribute('data-s').indexOf(q)>-1||sec.querySelector('h2').textContent.toLowerCase().indexOf(q)>-1;
      r.style.display=hit?'':'none';
      if(hit)any=true;
    });
    sec.querySelectorAll('.card').forEach(function(c){c.style.display=Array.prototype.some.call(c.querySelectorAll('.row'),function(r){return r.style.display!=='none'})?'':'none'});
    sec.querySelectorAll('.sub-h').forEach(function(h){var c=h.nextElementSibling;h.style.display=c&&c.style.display==='none'?'none':''});
    var show=inGroup&&any;
    sec.style.display=show?'':'none';
    if(show)shown++;
  });
  chipsEl.style.display=q?'none':'';
  emptyEl.style.display=shown?'none':'block';
}
function setGroup(g){
  group=g;
  document.getElementById('tab-food').setAttribute('aria-pressed',g==='food');
  document.getElementById('tab-drinks').setAttribute('aria-pressed',g==='drinks');
  buildChips();apply();window.scrollTo(0,0);setActive();
}
function stickH(){return document.querySelector('.sticky').offsetHeight}
function syncStick(){document.documentElement.style.setProperty('--stick',stickH()+'px')}
function setActive(){
  var secs=Array.prototype.filter.call(document.querySelectorAll('section'),function(s){return s.style.display!=='none'});
  var cur=null;
  var lim=stickH()+24;
  secs.forEach(function(s){if(s.getBoundingClientRect().top<=lim)cur=s.id});
  if(!cur&&secs.length)cur=secs[0].id;
  if(secs.length&&window.innerHeight+window.scrollY>=document.documentElement.scrollHeight-2)cur=secs[secs.length-1].id;
  chipsEl.querySelectorAll('.chip').forEach(function(c){
    var on=c.getAttribute('data-id')===cur;
    c.classList.toggle('on',on);
    if(on&&c.scrollIntoView){var box=chipsEl.getBoundingClientRect(),cb=c.getBoundingClientRect();if(cb.left<box.left||cb.right>box.right){chipsEl.scrollLeft+=cb.left-box.left-16}}
  });
}
chipsEl.addEventListener('click',function(e){
  var b=e.target.closest('.chip');if(!b)return;
  var t=document.getElementById(b.getAttribute('data-id'));
  if(t)t.scrollIntoView({behavior:'smooth',block:'start'});
});
document.getElementById('tab-food').addEventListener('click',function(){setGroup('food')});
document.getElementById('tab-drinks').addEventListener('click',function(){setGroup('drinks')});
qEl.addEventListener('input',function(){apply();syncStick();setActive()});
var tick=false;
window.addEventListener('scroll',function(){if(tick)return;tick=true;requestAnimationFrame(function(){setActive();tick=false})},{passive:true});
render();buildChips();apply();syncStick();setActive();
window.addEventListener('resize',function(){syncStick();setActive()});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(function(){syncStick();setActive()});
</script>
</body>
